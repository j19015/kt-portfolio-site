name: Deploy

on:
  push:
    branches: [main]
  # 毎日 JST 6:00 にブログRSSとGitHubの情報を取り直して再デプロイする
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

# 同時実行を1本に絞る。定期実行とpushが重なっても後勝ちで整合する
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # シークレット未設定でもワークフローを失敗させないための判定。
      # secrets は if: で直接参照できないので env 経由にする
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # prebuild で scripts/fetch-feeds.mjs が走る。
      # 取得に失敗してもリポジトリ内の前回JSONを使ってビルドは通る
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 取得できた最新データをリポジトリにも残す。
      # 次回ビルドで外部が落ちていたときのフォールバックを新しく保つため
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blog.json data/repos.json
          if git diff --staged --quiet; then
            echo "更新なし"
          else
            git commit -m "chore: refresh blog & repo data [skip ci]"
            git push
          fi

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=kt-portfolio --branch=main

      - name: Cloudflare のシークレット未設定を知らせる
        if: env.HAS_CF != 'true'
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のためデプロイをスキップしました"
          echo "ビルドは成功しています。リポジトリの Settings > Secrets and variables > Actions で設定してください"
